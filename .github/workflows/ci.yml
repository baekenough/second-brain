name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # 'feature/**' 는 스택 PR(#280 류: base 가 main 이 아니라 다른 feature
    # 브랜치)에도 CI 를 태우기 위함이다(#285). push 트리거는 그대로 main 만
    # 유지한다 — 스택 PR 은 머지되며 pull_request(synchronize) 이벤트만
    # 발생시키고, feature 브랜치로의 직접 push 는 없기 때문에 실행 빈도가
    # 늘지 않는다.
    branches: [main, 'feature/**']

# 동시성 그룹 (#285 보완). PR/브랜치 단위로 묶어, 같은 PR 에 커밋을 빠르게
# 여러 번 push 하면 옛 실행을 취소하고 최신 커밋만 돌린다 — feature/**
# 를 pull_request 대상에 추가(위)하면서 스택 PR 도 CI 대상이 되어 중복
# 실행 가능성이 늘었기 때문에 필요해졌다. main push 는 취소하지 않는다
# (배포·태그와 연결된 실행을 도중에 끊으면 안 된다).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go-lint-build-test:
    name: Go build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # pdftotext (poppler-utils) is now the primary PDF-extraction path since
      # ledongthuc/pdf was removed as the first fallback stage. The Go
      # integration tests actually invoke pdftotext, so it must be present
      # here just like it already is in the collector image's Dockerfile.
      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: go test
        run: go test -race -count=1 ./...

  store-integration:
    name: Store integration (pgvector + pg_bigm)
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:testpass@localhost:15432/testdb?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Build production PostgreSQL image
        run: docker build -t second-brain-postgres:test deploy/postgres
      - name: Start disposable test database
        run: |
          docker run -d --name store-test-db \
            -e POSTGRES_PASSWORD=testpass -e POSTGRES_DB=testdb \
            -p 127.0.0.1:15432:5432 \
            --health-cmd='pg_isready -U postgres -d testdb' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            second-brain-postgres:test
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' store-test-db)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs store-test-db
          exit 1
      - name: Test all stores on a fresh migrated database
        run: go test -race -count=1 ./internal/store/...
      - name: Verify repeatability and order independence
        run: go test -race -shuffle=on -count=2 ./internal/store/...
      - name: API handlers on the real database (Skip is a failure)
        # internal/api 의 *_RealDB 테스트는 TEST_DATABASE_URL 이 비어 있으면
        # t.Skip 으로 조용히 건너뛴다 — 이 job env(TEST_DATABASE_URL, 위)가
        # 이 단계에도 그대로 상속되므로 정상적으로는 절대 SKIP 이 나오면 안
        # 된다. SKIP 이 보이면 실DB 검증이 실제로는 실행되지 않았다는
        # 뜻이므로 조용히 넘어가지 않고 실패시킨다.
        run: |
          set -o pipefail
          go test -race -count=1 -v -run 'RealDB$' ./internal/api/... | tee api-realdb.log
          if grep -q -- '--- SKIP' api-realdb.log; then echo "::error::api real-DB test skipped"; exit 1; fi
          ran=$(grep -c -- '^--- PASS: Test.*_RealDB ' api-realdb.log || true)
          if [ "$ran" -lt 2 ]; then echo "::error::expected >=2 api real-DB tests, ran $ran"; exit 1; fi
      - name: Database logs
        if: failure()
        run: docker logs store-test-db
      - name: Remove disposable database
        if: always()
        run: docker rm -f store-test-db

  yaml-lint:
    name: k8s YAML + hygiene gates [1-7/7] (single source-of-truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Hermes calendar client
        run: python -m unittest discover -s deploy/hermes -p 'test_*.py'
      - name: Verify generated ontology graphs
        run: |
          python -m pip install -r scripts/ontology-requirements.txt
          python scripts/test_ontology_graphs.py
          python scripts/build-ontology-graphs.py --check
      - name: Run scripts/ci-checks.sh
        run: bash scripts/ci-checks.sh

  compose-deploy-readiness:
    name: Compose deploy-readiness lint (#162)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bare absolute host path guard (ci-checks.sh [6/7])
        run: bash scripts/ci-checks.sh
      - name: docker compose config validation
        run: |
          # Validate compose interpolation / syntax without requiring real secrets.
          # compose enforces some variables with ${VAR:?...} guards (e.g. NEO4J_PASSWORD)
          # to prevent silently starting with an empty secret. A blank .env.local stub
          # would trip those guards, so instead derive the stub from .env.local.example:
          # any variable compose requires via :? MUST be documented there, and this step
          # enforces that invariant — if a required var is missing from the example file,
          # docker compose config will fail here just as it would with a truly empty env.
          if [ -f .env.local.example ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.local.example | while IFS='=' read -r key val; do
              if [ -z "$val" ]; then
                echo "${key}=ci-stub-value"
              else
                echo "${key}=${val}"
              fi
            done > .env.local
          else
            touch .env.local
          fi
          set +e
          # docker compose only auto-loads a file literally named ".env" for
          # ${VAR} interpolation — env_file: entries (which point at .env.local)
          # are NOT used for interpolation, only for container runtime env.
          # --env-file must be passed explicitly so the derived stub above is
          # actually seen by ${NEO4J_PASSWORD:?...}-style required-var guards.
          ERR_OUTPUT=$(docker compose --env-file .env.local -f docker-compose.local.yml config --quiet 2>&1 >/dev/null)
          CONFIG_EXIT=$?
          set -e
          # Filter out known acceptable warnings (unset optional vars like AUTH_URL)
          REAL_ERRORS=$(printf '%s\n' "$ERR_OUTPUT" \
            | grep -v "variable is not set" \
            | grep -v "The .* variable is not set" \
            | grep -v "^$" || true)
          if [ $CONFIG_EXIT -ne 0 ] || [ -n "$REAL_ERRORS" ]; then
            echo "::error::docker compose config failed or produced unexpected errors"
            printf '%s\n' "$ERR_OUTPUT"
            exit 1
          fi
          echo "OK: docker compose config clean"

  docker-build-multiarch:
    name: Docker multi-arch build (no-cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, linux/arm64) — no cache
        run: |
          docker buildx build \
            --no-cache \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}" \
            --tag second-brain:ci \
            .

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (with reviewed allowlist)
        shell: bash
        run: |
          set -euo pipefail
          # -json 출력 스트림에서 "호출 경로가 있는" finding의 OSV ID만 모은다 (trace가 비어 있으면 import-only라 원래도 exit 0).
          govulncheck -json ./... > govulncheck.json || true
          jq -r 'select(.finding != null) | .finding | select((.trace // []) | length > 0 and .[0].function != null) | .osv' govulncheck.json | sort -u > found.txt
          grep -vE '^\s*(#|$)' .govulncheck-ignore | awk '{print $1}' | sort -u > ignored.txt
          echo "== called vulnerabilities =="; cat found.txt || true
          echo "== allowlisted =="; cat ignored.txt || true
          comm -23 found.txt ignored.txt > new.txt
          comm -13 found.txt ignored.txt > stale.txt
          if [ -s stale.txt ]; then echo "::warning::allowlist entries no longer reported (remove them): $(tr '\n' ' ' < stale.txt)"; fi
          if [ -s new.txt ]; then
            echo "::error::unreviewed vulnerabilities reachable from code: $(tr '\n' ' ' < new.txt)"
            govulncheck ./... || true
            exit 1
          fi
          echo "OK: no unreviewed reachable vulnerabilities"

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - name: bun install
        run: bun install --frozen-lockfile
      - name: next build
        run: bun run build
