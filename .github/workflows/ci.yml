name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-lint-build-test:
    name: Go build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -count=1 ./...

  yaml-lint:
    name: k8s YAML + hygiene gates [1-6/6] (single source-of-truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run scripts/ci-checks.sh
        run: bash scripts/ci-checks.sh

  compose-deploy-readiness:
    name: Compose deploy-readiness lint (#162)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bare absolute host path guard (ci-checks.sh [6/6])
        run: bash scripts/ci-checks.sh
      - name: docker compose config validation
        run: |
          # Validate compose interpolation / syntax without requiring real secrets.
          # compose enforces some variables with ${VAR:?...} guards (e.g. NEO4J_PASSWORD)
          # to prevent silently starting with an empty secret. A blank .env.local stub
          # would trip those guards, so instead derive the stub from .env.local.example:
          # any variable compose requires via :? MUST be documented there, and this step
          # enforces that invariant — if a required var is missing from the example file,
          # docker compose config will fail here just as it would with a truly empty env.
          if [ -f .env.local.example ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.local.example | while IFS='=' read -r key val; do
              if [ -z "$val" ]; then
                echo "${key}=ci-stub-value"
              else
                echo "${key}=${val}"
              fi
            done > .env.local
          else
            touch .env.local
          fi
          # web/ has no .env.local.example yet; keep it as an empty stub.
          touch web/.env.local
          set +e
          # docker compose only auto-loads a file literally named ".env" for
          # ${VAR} interpolation — env_file: entries (which point at .env.local)
          # are NOT used for interpolation, only for container runtime env.
          # --env-file must be passed explicitly so the derived stub above is
          # actually seen by ${NEO4J_PASSWORD:?...}-style required-var guards.
          ERR_OUTPUT=$(docker compose --env-file .env.local -f docker-compose.local.yml config --quiet 2>&1 >/dev/null)
          CONFIG_EXIT=$?
          set -e
          # Filter out known acceptable warnings (unset optional vars like AUTH_URL)
          REAL_ERRORS=$(printf '%s\n' "$ERR_OUTPUT" \
            | grep -v "variable is not set" \
            | grep -v "The .* variable is not set" \
            | grep -v "^$" || true)
          if [ $CONFIG_EXIT -ne 0 ] || [ -n "$REAL_ERRORS" ]; then
            echo "::error::docker compose config failed or produced unexpected errors"
            printf '%s\n' "$ERR_OUTPUT"
            exit 1
          fi
          echo "OK: docker compose config clean"

  docker-build-multiarch:
    name: Docker multi-arch build (no-cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, linux/arm64) — no cache
        run: |
          docker buildx build \
            --no-cache \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}" \
            --tag second-brain:ci \
            .

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - name: bun install
        run: bun install --frozen-lockfile
      - name: next build
        run: bun run build
