# Throwaway stack for run.sh. Nothing here is used by the real deployment.
name: second-brain-ptah-demo

services:
  postgres:
    build:
      context: ../../postgres
    image: second-brain-postgres:ptah-demo
    environment:
      POSTGRES_DB: second_brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    ports:
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U brain -d second_brain"]
      interval: 2s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:0.34.4
    ports:
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_OLLAMA_PORT:-55433}:11434"
    volumes:
      - ollama:/root/.ollama

  # `docker compose run --rm ptah inference ...`: the released Ptah image, on
  # the same network, so the specifications' http://ollama:11434/v1 resolves.
  ptah:
    image: ghcr.io/stokaro/ptah:0.8.0
    profiles: [tools]
    volumes:
      - ../specs:/specs:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ollama:
